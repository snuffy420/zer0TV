<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact · zer0 TV</title>
  <meta name="description" content="Contact zer0 TV for custom builds and support." />
  <style>
    :root {
      --bg: #121416;
      --panel: #1a1c1e;
      --green: #39ff14;
      --cyan: #00c8ff;
      --text: #c8d0d0;
      --dim: #6a8a7a;
      --edge: #2a2e30;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, sans-serif;
      background: radial-gradient(ellipse at top, #1a2220 0%, var(--bg) 55%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-top: 3px solid var(--green);
      border-radius: 8px;
      padding: 28px 28px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .brand img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--green);
      letter-spacing: 0.02em;
    }
    .sub {
      color: var(--cyan);
      font-size: 0.95rem;
      margin: 0 0 22px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--dim);
      margin: 14px 0 6px;
    }
    input, select, textarea {
      width: 100%;
      background: #0e1012;
      border: 1px solid var(--edge);
      border-radius: 6px;
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 1px rgba(57,255,20,.25);
    }
    textarea { min-height: 140px; resize: vertical; }
    button {
      margin-top: 20px;
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: var(--green);
      color: #0a0c0e;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .note {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--dim);
      line-height: 1.4;
    }
    .ok, .err {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .ok { background: rgba(57,255,20,.12); color: var(--green); border: 1px solid rgba(57,255,20,.35); }
    .err { background: rgba(255,80,80,.1); color: #ff8a8a; border: 1px solid rgba(255,80,80,.35); }
    a { color: var(--cyan); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="icon.png" alt="" width="40" height="40" />
      <h1>zer0 TV</h1>
    </div>
    <p class="sub">Custom builds &amp; project contact</p>

    <!--
      SETUP: Formspree endpoint is configured.
      1. Sign up at https://formspree.io (free)
      2. Create a new form → copy the endpoint like https://formspree.io/f/xxxxxx
      3. Paste it into the form action attribute.
      Messages go to the email you verify in Formspree — that email is never shown on this page.
    -->
    <form id="contactForm" action="https://formspree.io/f/myeekrpy" method="POST">
      <input type="hidden" name="_subject" value="zer0 TV contact" />
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none" />

      <label for="name">Name</label>
      <input id="name" name="name" type="text" required maxlength="120" placeholder="Your name" />

      <label for="email">Your email</label>
      <input id="email" name="email" type="email" required maxlength="200" placeholder="you@example.com" />

      <label for="topic">Topic</label>
      <select id="topic" name="topic">
        <option value="custom">Custom build / branding</option>
        <option value="feature">Feature request</option>
        <option value="bug">Bug report</option>
        <option value="other">Other</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" required maxlength="5000" placeholder="What do you need?"></textarea>

      <button type="submit" id="submitBtn">Send message</button>
    </form>

    <div class="ok" id="ok">Thanks — your message was sent.</div>
    <div class="err" id="err">Something went wrong. Check the form setup or try again later.</div>

    <p class="note">
      This form does not publish a personal email address.
      Powered by <a href="https://formspree.io" target="_blank" rel="noopener">Formspree</a>
      after you plug in your form endpoint (see HTML comments).
    </p>
  </div>

  <script>
    const form = document.getElementById('contactForm');
    const ok = document.getElementById('ok');
    const err = document.getElementById('err');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      ok.style.display = 'none';
      err.style.display = 'none';

      btn.disabled = true;
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          form.reset();
          ok.style.display = 'block';
        } else {
          err.style.display = 'block';
        }
      } catch (x) {
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
