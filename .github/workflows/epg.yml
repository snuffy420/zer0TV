name: Update all public guides

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - '.github/workflows/epg.yml'
      - 'tools/build_epg.py'
      - 'tools/build_provider_guides.py'
      - 'tools/discover_epg_sources.py'
      - 'tools/update_all_guides.py'
      - 'tools/guide_http.py'
      - 'epg/sources.json'
      - 'epg/providers.json'

permissions:
  contents: write

concurrency:
  group: all-public-guides
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Ensure we are on a real branch (not detached HEAD)
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh country, provider and Free-TV theme guides
        id: build
        continue-on-error: true
        run: python tools/update_all_guides.py --workers 4

      - name: Publish successful updates and coverage report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add epg/data epg/sources.json epg/providers.json config/epg-sources.json config/freetv-regions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public EPG data and country coverage'
            git push
          fi

      - name: Report upstream errors
        if: steps.build.outcome == 'failure'
        run: |
          echo 'Some upstream feeds failed. Successful guides were published; failed guides retain their last good data and will be retried.'
          exit 1
