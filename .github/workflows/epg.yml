name: Update country guides
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: country-guides
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build guide JSON
        id: build
        continue-on-error: true
        run: python tools/build_epg.py
      - name: Commit updated guides
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add epg/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update country EPG data'
            git push
          fi
      - name: Report feed failures
        if: steps.build.outcome == 'failure'
        run: exit 1
